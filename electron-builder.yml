appId: com.vteam.app
productName: Vteam
directories:
  output: dist-electron

files:
  - "electron/**/*"
  - ".next/**/*"
  - "public/**/*"
  - "node_modules/**/*"
  - "package.json"
  - "next.config.ts"

mac:
  category: public.app-category.business
  icon: public/icon.png
  target:
    - target: dmg
      arch:
        - arm64
        - x64

win:
  icon: public/icon.png
  target:
    - target: nsis
      arch:
        - x64

linux:
  icon: public/icon.png
  target:
    - target: AppImage
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
